<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin — Arena de Votos</title>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Barlow:wght@400;600;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg:    #0a0c14;
      --bg2:   #111420;
      --bg3:   #181c2e;
      --gold:  #F5C518;
      --red:   #E63946;
      --text:  #F0F2FF;
      --muted: rgba(240,242,255,0.45);
      --border:rgba(255,255,255,0.08);
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Barlow', sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      /* Padrão diagonal sutil de fundo */
      background-image: repeating-linear-gradient(
        45deg,
        transparent,
        transparent 40px,
        rgba(245,197,24,0.02) 40px,
        rgba(245,197,24,0.02) 41px
      );
    }

    .login-card {
      background: linear-gradient(145deg, var(--bg2), var(--bg3));
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 48px 40px;
      width: 100%;
      max-width: 400px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.7);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 28px;
      animation: slideUp 0.4s ease;
    }

    @keyframes slideUp {
      from { transform: translateY(24px); opacity: 0; }
      to   { transform: translateY(0);    opacity: 1; }
    }

    .login-icon {
      font-size: 48px;
      filter: drop-shadow(0 0 16px rgba(245,197,24,0.5));
    }

    .login-title {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 32px;
      letter-spacing: 3px;
      color: var(--gold);
      text-align: center;
      line-height: 1.1;
    }

    .login-sub {
      font-size: 12px;
      letter-spacing: 2px;
      color: var(--muted);
      text-transform: uppercase;
      margin-top: -18px;
    }

    .form-group {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .form-group label {
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 2px;
      color: var(--muted);
      text-transform: uppercase;
    }

    .form-group input {
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 10px;
      color: var(--text);
      font-family: 'Barlow', sans-serif;
      font-size: 15px;
      padding: 13px 16px;
      width: 100%;
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
    }

    .form-group input:focus {
      border-color: rgba(245,197,24,0.4);
      box-shadow: 0 0 0 3px rgba(245,197,24,0.08);
    }

    .form-fields {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    /* Erro de autenticação */
    .erro-box {
      width: 100%;
      background: rgba(230,57,70,0.12);
      border: 1px solid rgba(230,57,70,0.35);
      border-radius: 10px;
      padding: 12px 16px;
      font-size: 13px;
      font-weight: 600;
      color: #ff6b7a;
      text-align: center;
      animation: shake 0.4s ease;
    }

    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      20%       { transform: translateX(-6px); }
      40%       { transform: translateX(6px); }
      60%       { transform: translateX(-4px); }
      80%       { transform: translateX(4px); }
    }

    .login-btn {
      width: 100%;
      background: linear-gradient(135deg, var(--gold), #d4a017);
      color: #0a0c14;
      border: none;
      border-radius: 12px;
      font-family: 'Bebas Neue', sans-serif;
      font-size: 22px;
      letter-spacing: 3px;
      padding: 14px;
      cursor: pointer;
      transition: all 0.25s;
      box-shadow: 0 4px 20px rgba(245,197,24,0.3);
    }

    .login-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 30px rgba(245,197,24,0.5);
    }

    .login-btn:active { transform: scale(0.98); }

    .back-link {
      font-size: 12px;
      color: var(--muted);
      text-decoration: none;
      letter-spacing: 1px;
      transition: color 0.2s;
    }
    .back-link:hover { color: var(--text); }

    .lock-badge {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 11px;
      color: var(--muted);
      letter-spacing: 1px;
    }
  </style>
</head>
<body>

  <div class="login-card">
    <div class="login-icon">🔐</div>
    <div>
      <div class="login-title">Área Restrita</div>
      <div class="login-sub">Somente administradores</div>
    </div>

    {% if erro %}
    <div class="erro-box">⚠ {{ erro }}</div>
    {% endif %}

    <!-- Formulário de login: envia para /admin/login via POST -->
    <form class="form-fields" action="/admin/login" method="POST">
      <div class="form-group">
        <label for="usuario">Usuário</label>
        <input type="text" id="usuario" name="usuario"
               placeholder="Digite seu usuário" autocomplete="username" required />
      </div>
      <div class="form-group">
        <label for="senha">Senha</label>
        <input type="password" id="senha" name="senha"
               placeholder="••••••••" autocomplete="current-password" required />
      </div>
      <button type="submit" class="login-btn">ENTRAR</button>
    </form>

    <div class="lock-badge">🔒 Acesso monitorado e restrito</div>
    <a href="/" class="back-link">← Voltar para a votação</a>
  </div>

</body>
</html>
